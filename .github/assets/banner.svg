<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="GhostBind — turn your DualSense into a virtual Xbox 360 controller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="0.55" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="20" fill="url(#glow)"/>

  <!-- gamepad mark -->
  <g transform="translate(80,82)">
    <path d="M -34 -8 Q -38 -22 -24 -22 L 24 -22 Q 38 -22 34 -8 L 40 16 Q 42 28 30 28 Q 22 28 18 20 L 14 12 L -14 12 L -18 20 Q -22 28 -30 28 Q -42 28 -40 16 Z" fill="#ffffff"/>
    <circle cx="-16" cy="-3" r="6.5" fill="#9333EA"/>
    <circle cx="15" cy="-3" r="6.5" fill="#EC4899"/>
    <rect x="-23" y="-5" width="3.4" height="11" rx="1.5" fill="#9333EA"/>
    <rect x="-29" y="-1.2" width="11" height="3.4" rx="1.5" fill="#9333EA"/>
  </g>

  <text x="132" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">GhostBind</text>
  <text x="135" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" opacity="0.97">Turn your DualSense into a virtual Xbox 360 controller — and tune it.</text>
  <rect x="135" y="150" width="528" height="28" rx="14" fill="#ffffff" opacity="0.16"/>
  <text x="151" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#ffffff" opacity="0.95">deadzones · response curves · button remap · per-game auto-switch</text>
